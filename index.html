<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Аха тэмцээн</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;700&display=swap">
<style>
/* Layout: scoreboard on top, one stage below that steps grade -> topic -> points -> question */
:root{
  --bg:#fffdfc; --panel:rgba(255,255,255,.80); --panel2:rgba(255,246,251,.92); --line:#ecdff2;
  --fg:#3b3452; --muted:#8c84a6; --gold:#e0568f; --ink:#ffffff;
  --t1:#ee5a86; --t2:#1fa6c2; --t3:#7d5fe0;
  --ok:#35c27a; --bad:#f2596d;
  --display:'Unbounded','Arial Black',sans-serif; --body:'Golos Text','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:relative}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:-1}
#fx{z-index:50}
.wrap{position:relative;z-index:1}
.stage,.team{backdrop-filter:blur(4px)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(20px,4vw,28px);letter-spacing:.02em}
h1 span{color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

/* scoreboard */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;border-top:4px solid var(--c)}
.team.turn{box-shadow:0 0 0 2px var(--c);background:var(--panel2)}
.team input{background:transparent;border:0;color:var(--fg);font:500 14px var(--body);padding:0;width:100%;min-width:0}
.team input:focus{outline:1px dashed var(--muted)}
.score{font-family:var(--display);font-size:clamp(22px,5vw,34px);font-variant-numeric:tabular-nums;color:var(--c)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.team.turn .tag{color:var(--c)}
.pop{position:absolute;right:12px;top:10px;font-weight:700;font-size:15px;animation:pop 1.4s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* stage */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs b{color:var(--gold);font-weight:500}
h2{font-size:clamp(17px,3.2vw,22px)}
.grid{display:grid;gap:12px}
.g-grade{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-topic{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-pts{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card strong{font-family:var(--display);font-size:16px;font-weight:700}
.card small{color:var(--muted);font-size:12px}
.pt{align-items:center;justify-content:center;text-align:center;min-height:76px;font-family:var(--display);font-size:clamp(16px,3.4vw,24px);color:var(--gold);font-variant-numeric:tabular-nums}
.pt.used{opacity:.25;pointer-events:none;text-decoration:line-through}

/* question */
.qtop{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.worth{font-family:var(--display);color:var(--gold);font-size:18px}
.timer{--p:1;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--tc,var(--gold)) calc(var(--p)*360deg),var(--line) 0)}
.timer span{width:62px;height:62px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.timer.low{--tc:var(--bad)}
.q{font-size:clamp(19px,3.6vw,26px);font-weight:500;line-height:1.35;max-width:46ch;text-wrap:balance}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who .tag{margin-right:4px}
.pick{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-size:14px}
.pick.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:64px;transition:background .2s,border-color .2s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt i{font:700 14px var(--display);font-style:normal;width:32px;height:32px;border-radius:9px;background:#fff0f7;display:grid;place-items:center;flex:none;color:var(--gold)}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:#1c9a57;color:#fff;animation:glow 1s}
.opt.ok i{background:#fff;color:#1c9a57}
.opt.bad{background:var(--bad);border-color:#c93a4d;color:#fff;animation:shake .4s}
.opt.bad i{background:#fff;color:#c93a4d}
@keyframes glow{0%{box-shadow:0 0 0 0 #1fb860aa}100%{box-shadow:0 0 0 22px #1fb86000}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.verdict{font-family:var(--display);font-size:18px;min-height:26px}
.verdict.ok{color:#1c9a57}.verdict.bad{color:#d8384f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:560px){.opts{grid-template-columns:1fr}.g-pts{grid-template-columns:repeat(2,minmax(0,1fr))}.board{gap:6px}.team{padding:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html{color-scheme:light}body{margin:0}</style>
</head>

const $=s=>document.querySelector(s);
const stage=$('#stage'), board=$('#board');
const TEAMS=[{n:'1-р баг',c:'var(--t1)',s:0,shown:0},{n:'2-р баг',c:'var(--t2)',s:0,shown:0},{n:'3-р баг',c:'var(--t3)',s:0,shown:0}];
let turn=0, used={}, state={view:'grade',g:null,t:null}, timerId=null, audio=null;

function beep(f,d,type){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}

function renderBoard(){
  board.innerHTML='';
  TEAMS.forEach((t,i)=>{
    const d=document.createElement('div');d.className='team'+(i===turn?' turn':'');d.style.setProperty('--c',t.c);
    d.innerHTML='<span class="tag">'+(i===turn?'Сонгох ээлж':'Баг '+(i+1))+'</span><input aria-label="Багийн нэр" value="'+t.n+'" maxlength="22"><span class="score" id="sc'+i+'">'+t.shown+'</span>';
    d.querySelector('input').addEventListener('input',e=>{t.n=e.target.value});
    board.appendChild(d);
  });
}
function roll(i,delta){
  const t=TEAMS[i],from=t.shown,to=t.s,start=performance.now(),dur=1100;
  const card=board.children[i];
  const p=document.createElement('span');p.className='pop';p.style.color=delta>0?'var(--ok)':'var(--bad)';p.textContent=(delta>0?'+':'')+delta;card.appendChild(p);setTimeout(()=>p.remove(),1500);
  (function step(now){
    const k=Math.min(1,(now-start)/dur),e=1-Math.pow(1-k,3);
    t.shown=Math.round(from+(to-from)*e);
    const el=document.getElementById('sc'+i);if(el)el.textContent=t.shown;
    if(k<1)requestAnimationFrame(step);
  })(start);
}

function crumbs(){
  const g=GRADES.find(x=>x[0]===state.g),t=TOPICS.find(x=>x[0]===state.t);
  let h='<div class="crumbs">';
  if(state.view!=='grade')h+='<button class="btn" data-back>← Буцах</button>';
  if(g)h+='<b>'+g[1]+'</b>';
  if(t)h+=' › <b>'+t[1]+'</b>';
  return h+'</div>';
}
function render(){
  clearInterval(timerId);renderBoard();
  if(state.view==='grade'){
    stage.innerHTML='<h2>Аль ангиллаар тоглох вэ?</h2><div class="grid g-grade">'+GRADES.map(g=>'<button class="card" data-g="'+g[0]+'"><strong>'+g[1]+'</strong><small>'+g[2]+'</small></button>').join('')+'</div>';
  }else if(state.view==='topic'){
    stage.innerHTML=crumbs()+'<h2>Сэдвээ сонгоно уу</h2><div class="grid g-topic">'+TOPICS.map(t=>{
      const left=LV.filter(l=>!used[state.g+t[0]+l]).length;
      return '<button class="card" data-t="'+t[0]+'"><strong>'+t[1]+'</strong><small>Үлдсэн: '+left+' / 10</small></button>'}).join('')+'</div>';
  }else if(state.view==='pts'){
    stage.innerHTML=crumbs()+'<h2>Оноогоо сонгоно уу</h2><div class="grid g-pts">'+LV.map(l=>'<button class="card pt'+(used[state.g+state.t+l]?' used':'')+'" data-l="'+l+'">'+l+'</button>').join('')+'</div>';
  }
  stage.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.g=b.dataset.g;state.view='topic';render()});
  stage.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{state.t=b.dataset.t;state.view='pts';render()});
  stage.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>ask(+b.dataset.l));
  const bk=stage.querySelector('[data-back]');
  if(bk)bk.onclick=()=>{if(state.view==='pts'){state.view='topic';state.t=null}else{state.view='grade';state.g=null}render()};
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function ask(level){
  const key=state.g+state.t+level;used[key]=true;
  const raw=D[state.g][state.t][LV.indexOf(level)].split('|');
  const q=raw[0],right=raw[1],opts=shuffle(raw.slice(1).map((t,i)=>({t,ok:i===0})));
  let who=turn,done=false,left=60;
  const L='АБВГ';
  stage.innerHTML=crumbs().replace('<button class="btn" data-back>← Буцах</button>','')+
   '<div class="qtop"><div class="worth">'+level+' оноо</div><div class="timer" id="tm"><span id="tn">60</span></div></div>'+
   '<div class="q">'+q+'</div>'+
   '<div class="who"><span class="tag">Хариулж буй баг</span>'+TEAMS.map((t,i)=>'<button class="pick'+(i===who?' on':'')+'" data-w="'+i+'" style="--c:'+t.c+'">'+t.n+'</button>').join('')+'</div>'+
   '<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'"><i>'+L[i]+'</i><span>'+o.t+'</span></button>').join('')+'</div>'+
   '<div class="verdict" id="vd"></div><div class="row" id="nx"></div>';
  const btns=[...stage.querySelectorAll('.opt')];
  stage.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(done)return;who=+b.dataset.w;stage.querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x===b))});
  function finish(msg,cls){
    done=true;clearInterval(timerId);btns.forEach(b=>b.disabled=true);
    opts.forEach((o,i)=>{if(o.ok)btns[i].classList.add('ok')});
    const v=$('#vd');v.textContent=msg;v.className='verdict '+cls;
    $('#nx').innerHTML='<button class="btn gold" id="go">Үргэлжлүүлэх</button>';
    $('#go').onclick=()=>{turn=(turn+1)%3;state.view='pts';render()};
    stage.querySelectorAll('.pick').forEach(x=>x.disabled=true);
  }
  btns.forEach((b,i)=>b.onclick=()=>{
    if(done)return;
    if(opts[i].ok){
      b.classList.add('ok');TEAMS[who].s+=level;finish('Зөв! '+TEAMS[who].n+' +'+level,'ok');renderKeep();roll(who,level);burst(level>=1000);beep(660,.18);setTimeout(()=>beep(880,.25),160);
    }else{
      b.classList.add('bad');
      const pen=$('#penalty').checked;
      if(pen){TEAMS[who].s-=level}
      finish('Буруу. Зөв хариулт: '+right,'bad');
      if(pen){renderKeep();roll(who,-level)}
      beep(180,.35,'sawtooth');
    }
  });
  function renderKeep(){ // keep scoreboard DOM but refresh names/turn classes
    [...board.children].forEach((c,i)=>c.classList.toggle('turn',i===turn));
  }
  const tm=$('#tm');
  timerId=setInterval(()=>{
    left--;$('#tn').textContent=left;tm.style.setProperty('--p',left/60);
    tm.classList.toggle('low',left<=10);
    if(left<=10&&left>0)beep(520,.06);
    if(left<=0){finish('Хугацаа дууслаа. Зөв хариулт: '+right,'bad');beep(140,.5,'square')}
  },1000);
}


/* ---- pastel confetti background ---- */
const PAL=['#ffb8d6','#bfeee9','#fff2a8','#d8c8ff','#c9f0c4','#ffd1b8'];
const STAR=['#ffcf5c','#ff9ec8','#8fe0e0'];
function starPath(c,x,y,R,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,r=i%2?R*.45:R;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath()}
function rnd(a,b){return a+Math.random()*(b-a)}
function paintBg(){
  const cv=$('#bg'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  c.fillStyle='#fffdfc';c.fillRect(0,0,W,H);
  const n=Math.max(6,Math.round(W*H/120000));
  c.save();c.filter='blur(7px)';c.lineCap='round';
  for(let i=0;i<n;i++){
    const x=rnd(0,W),y=rnd(0,H),R=rnd(40,80);c.strokeStyle=PAL[i%PAL.length]+'aa';c.lineWidth=rnd(12,20);c.beginPath();
    if(i%2){for(let t=0;t<14;t+=.2){const r=R*(t/14);c.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r)}}
    else{starPath(c,x,y,R*1.2,rnd(0,1));}
    c.stroke();
  }
  c.restore();
  for(let i=0;i<W*H/260;i++){c.fillStyle=PAL[i%PAL.length]+(i%9?'88':'cc');c.beginPath();c.arc(rnd(0,W),rnd(0,H),rnd(.6,2.6),0,7);c.fill()}
  for(let i=0;i<W*H/9000;i++){c.fillStyle=STAR[i%3];starPath(c,rnd(0,W),rnd(0,H),rnd(4,8),rnd(0,1));c.fill()}
}
paintBg();let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(paintBg,200)});

/* ---- cute burst when points are won ---- */
const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],raf=0;
function fit(){const d=Math.min(2,window.devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
function burst(big){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const n=big?90:55,W=innerWidth,H=innerHeight;
  for(let i=0;i<n;i++){
    const side=i%2?1:0;
    parts.push({x:side?W*.85:W*.15,y:H*.75,vx:(side?-1:1)*rnd(1,7),vy:-rnd(8,17),g:.28,r:rnd(7,16),rot:rnd(0,6),vr:rnd(-.15,.15),
      kind:['star','heart','swirl','dot'][i%4],col:[...PAL,...STAR][i%9],life:1});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s,x,y-s*.4);c.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.3,x,y+s*.35);c.fill()}
function tick(){
  fc.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.007;
    fc.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));fc.fillStyle=p.col;fc.strokeStyle=p.col;
    if(p.kind==='star'){starPath(fc,p.x,p.y,p.r,p.rot);fc.fill()}
    else if(p.kind==='heart'){heart(fc,p.x,p.y,p.r)}
    else if(p.kind==='dot'){fc.beginPath();fc.arc(p.x,p.y,p.r*.4,0,7);fc.fill()}
    else{fc.lineWidth=3;fc.lineCap='round';fc.beginPath();for(let t=0;t<9;t+=.4){const r=p.r*t/9;fc.lineTo(p.x+Math.cos(t+p.rot)*r,p.y+Math.sin(t+p.rot)*r)}fc.stroke()}
  }
  fc.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!parts.length)fc.clearRect(0,0,innerWidth,innerHeight);
}

$('#reset').onclick=()=>{TEAMS.forEach(t=>{t.s=0;t.shown=0});used={};turn=0;state={view:'grade',g:null,t:null};render()};
render();
</script>
